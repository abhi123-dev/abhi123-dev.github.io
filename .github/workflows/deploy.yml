name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A4A1DF: ${{ secrets.A4A1DF }}
          B05B54: ${{ secrets.B05B54 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('A4A1DF', ''), os.environ.get('B05B54', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- 4a651781ba7dc251b368e117d3ab1dae9d32e3d7 -->', a)
          if b:
              patched = patched.replace('<!-- 1d368acd48f9db5047cdd9 -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
